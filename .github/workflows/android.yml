name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug :app:lintDebug --stacktrace
      - name: Enable emulator acceleration
        run: |
          sudo chmod a+rw /dev/kvm
      - name: Smoke test Android UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 600
          script: |
            adb shell input keyevent 82
            adb shell wm dismiss-keyguard
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.personal.privatevpn/.MainActivity
            sleep 15
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml ui-smoke.xml
            grep -q 'RYZEN' ui-smoke.xml
            adb shell pidof com.personal.privatevpn
            adb shell screencap -p /sdcard/screen.png
            adb pull /sdcard/screen.png ui-smoke.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UI-smoke
          path: |
            ui-smoke.xml
            ui-smoke.png
      - uses: actions/upload-artifact@v4
        with:
          name: Ryzen-VPN-debug
          path: app/build/outputs/apk/debug/app-debug.apk
  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Ryzen-VPN-debug
      - name: Upload APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv app-debug.apk Ryzen-VPN-v0.2.2-alpha-debug.apk
          sha256sum Ryzen-VPN-v0.2.2-alpha-debug.apk > SHA256SUMS.txt
          gh release view v0.2.2-alpha || gh release create v0.2.2-alpha --target "${{ github.sha }}" --prerelease --title "Ryzen VPN v0.2.2-alpha" --notes "Coding-style title typing and backspacing animation, paused in background and disabled when system animations are off. Import working WireGuard profiles. No hosted endpoints are bundled. Debug-signed APK; uninstall the earlier debug build if Android reports a signature mismatch. UI smoke test and lint passed."
          gh release upload v0.2.2-alpha Ryzen-VPN-v0.2.2-alpha-debug.apk SHA256SUMS.txt --clobber
