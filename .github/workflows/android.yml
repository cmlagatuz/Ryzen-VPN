name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug :app:lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Ryzen-VPN-debug
          path: app/build/outputs/apk/debug/app-debug.apk
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Ryzen-VPN-debug
      - name: Upload APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv app-debug.apk Ryzen-VPN-v0.1.0-alpha-debug.apk
          sha256sum Ryzen-VPN-v0.1.0-alpha-debug.apk > SHA256SUMS.txt
          gh release upload v0.1.0-alpha Ryzen-VPN-v0.1.0-alpha-debug.apk SHA256SUMS.txt --clobber
