name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug :app:lintDebug --stacktrace
      - name: Smoke test Android UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.personal.privatevpn/.MainActivity
            sleep 5
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml ui-smoke.xml
            grep -q 'RYZEN' ui-smoke.xml
            adb shell pidof com.personal.privatevpn
            adb shell screencap -p /sdcard/screen.png
            adb pull /sdcard/screen.png ui-smoke.png
      - uses: actions/upload-artifact@v4
        with:
          name: UI-smoke
          path: |
            ui-smoke.xml
            ui-smoke.png
      - uses: actions/upload-artifact@v4
        with:
          name: Ryzen-VPN-debug
          path: app/build/outputs/apk/debug/app-debug.apk
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Ryzen-VPN-debug
      - name: Upload APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv app-debug.apk Ryzen-VPN-v0.2.0-alpha-debug.apk
          sha256sum Ryzen-VPN-v0.2.0-alpha-debug.apk > SHA256SUMS.txt
          gh release view v0.2.0-alpha || gh release create v0.2.0-alpha --target "${{ github.sha }}" --prerelease --title "Ryzen VPN v0.2.0-alpha" --notes "Interactive rotatable globe, country selection, city profiles, real host addresses, handshake pulse and live tunnel throughput. Import working WireGuard profiles. No hosted endpoints are bundled. Debug-signed APK; uninstall the earlier debug build if Android reports a signature mismatch. UI smoke test and lint passed."
          gh release upload v0.2.0-alpha Ryzen-VPN-v0.2.0-alpha-debug.apk SHA256SUMS.txt --clobber
